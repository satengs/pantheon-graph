name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vercel:
    name: Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_AUTH_ENABLED: "false"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy prebuilt
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy by project name
        if: ${{ env.VERCEL_TOKEN != '' && (env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '') }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN" --name pantheon-graph
      - name: Missing token
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "Set repo secret VERCEL_TOKEN to deploy from Actions."
          echo "Optional: VERCEL_ORG_ID and VERCEL_PROJECT_ID for a linked prebuilt deploy."
